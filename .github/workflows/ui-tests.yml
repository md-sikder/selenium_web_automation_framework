name: UI Tests

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare report directories
        run: |
          mkdir -p reports
          mkdir -p logs
          mkdir -p screenshots

      # CI should run headless; your conftest supports CLI flag and env var.
      - name: Run tests (headless, parallel)
        env:
          HEADLESS: "true"     # falls back if CLI flag not used; safe to keep
        run: |
          pytest -n auto --env=test \
            --html=reports/report.html --self-contained-html \
            -q

      # Always upload artifacts even on failure so you can debug
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html
          path: reports/report.html
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore
